name: Release PowerShell Module

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  package-and-release:
    runs-on: windows-latest
    environment: tenant-audit

    env:
      MODULE_NAME: ZeroTrustAssessment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Package module
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $eventName = '${{ github.event_name }}'
          $tag = switch ($eventName) {
            'release' { '${{ github.event.release.tag_name }}'; break }
            default { '${{ github.ref_name }}' }
          }

          if ($eventName -eq 'workflow_dispatch' -and '${{ github.ref_type }}' -ne 'tag') {
            throw "Manual release runs must be started from a tag ref. Select a tag such as v0.1.0 when running this workflow."
          }

          if ($tag -notmatch '^v(?<ModuleVersion>\d+\.\d+\.\d+)(?:-(?<Prerelease>[0-9A-Za-z][0-9A-Za-z._-]*))?$') {
            throw "Release tags must match v<major>.<minor>.<patch> with an optional prerelease suffix, for example v0.1.0, v2.4.0-kodevza, or v2.4.0-memory_gc. Received: $tag"
          }

          $version = $Matches.ModuleVersion
          $packageVersion = $tag.TrimStart('v')
          $moduleName = $env:MODULE_NAME
          $releaseDirectory = Join-Path $PWD 'build/release'
          $moduleDirectory = Join-Path (Join-Path $releaseDirectory $moduleName) $version
          $artifactDirectory = Join-Path $PWD 'artifacts'
          $zipPath = Join-Path $artifactDirectory "$moduleName-$tag.zip"

          Remove-Item -Path $releaseDirectory, $artifactDirectory -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -Path $artifactDirectory -ItemType Directory -Force | Out-Null

          & .\build\powershell\Install-CIPrerequisites.ps1
          & .\build\powershell\Build-ReleasePSModule.ps1 `
            -BaseDirectory $PWD `
            -OutputDirectory $releaseDirectory `
            -ReleaseVersion $packageVersion

          if (!(Test-Path -Path $moduleDirectory -PathType Container)) {
            throw "Expected build output directory was not found: $moduleDirectory"
          }

          Compress-Archive -Path $moduleDirectory -DestinationPath $zipPath -Force

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "module_dir=$moduleDirectory" >> $env:GITHUB_OUTPUT
          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT
          "zip_name=$(Split-Path -Path $zipPath -Leaf)" >> $env:GITHUB_OUTPUT

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
          enable-AzPSSession: true

      - name: Test Graph access
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $token = az account get-access-token `
            --resource-type ms-graph `
            --query accessToken -o tsv

          if ([string]::IsNullOrWhiteSpace($token)) {
            throw 'Azure CLI did not return a Microsoft Graph access token.'
          }

          $headers = @{ Authorization = "Bearer $token" }

          Invoke-RestMethod `
            -Method GET `
            -Headers $headers `
            -Uri "https://graph.microsoft.com/v1.0/organization"

      - name: Run Zero Trust assessment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $moduleDirectory = '${{ steps.package.outputs.module_dir }}'
          $moduleManifest = Join-Path $moduleDirectory 'ZeroTrustAssessment.psd1'
          if (!(Test-Path -Path $moduleManifest -PathType Leaf)) {
            throw "Expected module manifest was not found: $moduleManifest"
          }

          Import-Module $moduleManifest -Force

          $token = az account get-access-token `
            --resource-type ms-graph `
            --query accessToken -o tsv

          if ([string]::IsNullOrWhiteSpace($token)) {
            throw 'Azure CLI did not return a Microsoft Graph access token.'
          }

          $secureToken = ConvertTo-SecureString -String $token -AsPlainText -Force
          Connect-MgGraph -AccessToken $secureToken -NoWelcome

          Connect-ZtAssessment -Service Graph, Azure -TenantId '${{ vars.AZURE_TENANT_ID }}'
          Invoke-ZtAssessment -Path "./ZeroTrustReport95" -DisableTelemetry -NoBrowser

      - name: Validate Zero Trust report
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $reportPath = Join-Path $PWD 'ZeroTrustReport95/ZeroTrustAssessmentReport.html'
          if (!(Test-Path -Path $reportPath -PathType Leaf)) {
            throw "Expected Zero Trust report was not produced: $reportPath"
          }

          $report = Get-Item -Path $reportPath
          $minimumSizeBytes = 100KB
          if ($report.Length -le $minimumSizeBytes) {
            throw "Zero Trust report is too small: $($report.Length) bytes. Expected more than $minimumSizeBytes bytes."
          }

          Write-Host "Zero Trust report produced: $reportPath ($($report.Length) bytes)."

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          $tag = '${{ steps.package.outputs.tag }}'
          $zipPath = '${{ steps.package.outputs.zip_path }}'
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'

          git log -1 --pretty=%B | Set-Content -Path $notesPath -Encoding utf8
          gh release create $tag $zipPath --title $tag --notes-file $notesPath --verify-tag --prerelease
