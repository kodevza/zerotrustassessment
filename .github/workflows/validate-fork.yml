on: [pull_request]

jobs:
  validate:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
    - name: Install CI Prerequisites
      run: .\build\powershell\Install-CIPrerequisites.ps1
      shell: pwsh
    - name: Validate
      env:
        TEMP: ${{ runner.temp }}
        TMP: ${{ runner.temp }}
      run: .\code-tests\pester.ps1
      shell: pwsh
